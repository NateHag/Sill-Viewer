[package]
name = "sill-viewer"
version = "0.1.0"
edition = "2021"
description = "A desktop viewer for Sill hosts (Mac, Linux): Mac, Windows and Linux"
license = "Apache-2.0"

[dependencies]
eframe = { version = "=0.29.1", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
x509-parser = "0.16"
if-addrs = "0.13"
arboard = { version = "3", default-features = false }
mdns-sd = "0.21"
ffmpeg-next = "9.0"
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
rand = "0.8"
bytemuck = { version = "1", features = ["derive"] }
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4

[profile.dev]
opt-level = 1

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.2.2", features = ["NSApplication", "NSWindow", "NSResponder"] }
objc2-foundation = { version = "0.2.2", features = ["NSArray", "NSEnumerator", "NSThread"] }

# egui-wgpu builds wgpu without DirectX 12; turn it on for Windows (the viewer prefers it there).
[target.'cfg(windows)'.dependencies]
wgpu = { version = "22.1", default-features = false, features = ["dx12", "wgsl"] }
raw-window-handle = "0.6"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
